name: release

on:
    push:
        tags: ["v*"]

permissions:
    contents: write
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Tag matches package version
              run: |
                  version=$(node -p "require('./packages/leeway/package.json').version")
                  if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
                      echo "::error::tag $GITHUB_REF_NAME does not match packages/leeway version $version"
                      exit 1
                  fi
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: pnpm
                  registry-url: https://registry.npmjs.org
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            - run: pnpm verify
            - run: npm publish
              working-directory: packages/leeway
            - run: gh release create "$GITHUB_REF_NAME" --generate-notes
              env:
                  GH_TOKEN: ${{ github.token }}
